<title>MySelfRep 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
  /* 文字だけの画面。縦に流れる罫線ツリー一覧。選択中の項目と説明文だけを色で区別する */
  :root {
    --bg: #eef1f4;
    --fg: #1d2733;
    --muted: #5c6b7a;
    --accent: #2f5d8a;
    --line: #cbd3dc;
    --font: "M PLUS 1 Code", "BIZ UDGothic", "Noto Sans Mono CJK JP", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --fg: #d8dee6; --muted: #8794a3; --accent: #8fb4db; --line: #2a333e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --fg: #d8dee6; --muted: #8794a3; --accent: #8fb4db; --line: #2a333e;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--font); font-size: 15px; line-height: 1.7; padding-inline: 16px; }
  #app { max-width: 40rem; margin: 0 auto; padding-block: 16px 0; display: flex; flex-direction: column; gap: 4px; }
  .status { color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
  .title { font-size: 1em; font-weight: 600; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .tree { display: flex; flex-direction: column; }
  .row, .detail { display: flex; align-items: baseline; margin: 0; }
  .row {
    font: inherit; color: inherit; background: none; border: 0; text-align: left;
    padding: 4px 0; cursor: pointer; min-height: 36px; width: 100%;
  }
  .row.is-group { font-weight: 600; }
  .row.is-selected .text { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cells { display: flex; flex: none; color: var(--muted); font-weight: 400; }
  .cell { display: inline-block; width: 1em; text-align: center; }
  .text { min-width: 0; overflow-wrap: anywhere; }
  .detail { color: var(--muted); padding-block: 1px; }
  .detail .text { color: var(--fg); }
  .description {
    position: sticky; bottom: 0; margin: 8px 0 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    color: var(--fg);
  }
</style>
<div id="app"></div>
<script src="dist/app.js"></script>
